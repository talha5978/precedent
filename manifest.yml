modules:
  jira:globalPage:
    - key: precedent-home
      resource: main
      resolver:
        function: resolver
      render: native
      title: Precedent
  jira:issuePanel:
    - key: precedent-issue-panel
      resource: issue-panel
      resolver:
        function: resolver
      render: native
      title: Precedent Decisions
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
  rovo:agent:
    - key: precedent-agent
      name: Precedent Decision Agent
      description: Answers architectural and engineering decision questions with cited sources, searches the decision registry, traces decision lineage, and checks issues for contradictions.
      prompt: >
        You are Precedent, the organizational memory and decision governance agent for engineering teams.
        Your role is to help engineers, architects, and new joiners understand why decisions were made,
        trace supersession and dependency lineage, and verify whether proposed work contradicts existing decisions.
        Follow these core rules:
        1. Evidence over assertion: Always cite the source (Confluence page, ADR, or Jira comment) and quoted excerpt provided by the actions.
        2. Honest uncertainty: If a decision lacks an explicit rationale, state plainly "No explicit rationale recorded." If no decisions match, say so clearly.
        3. Contradiction awareness: When users ask about proposed technologies or approaches, check active decisions for contradictions.
      conversationStarters:
        - "Why do we use PostgreSQL for primary storage?"
        - "Search our decisions for database and caching guidelines"
        - "Does my ticket plan conflict with any team decisions?"
      actions:
        - search-decisions-action
        - get-decision-action
        - check-issue-conflicts-action
  action:
    - key: search-decisions-action
      name: Search Decisions
      function: rovoActionHandler
      actionVerb: GET
      description: Searches the Precedent decision registry for active, superseded, or historical decisions matching keywords, technologies, components, or projects.
      inputs:
        query:
          title: Search Query
          type: string
          required: true
          description: Keywords, component names, or technologies to search for (e.g. 'postgres', 'redis', 'graphql').
    - key: get-decision-action
      name: Get Decision Details and Lineage
      function: rovoActionHandler
      actionVerb: GET
      description: Retrieves full details of a specific decision including its statement, rationale, owner, source citation, and supersedes/depends-on lineage.
      inputs:
        id:
          title: Decision ID
          type: string
          required: true
          description: The unique identifier of the decision (e.g. 'dec_sample_postgres').
    - key: check-issue-conflicts-action
      name: Check Issue for Decision Contradictions
      function: rovoActionHandler
      actionVerb: GET
      description: Evaluates a Jira issue's summary and description against active team decisions to detect architectural contradictions or policy violations.
      inputs:
        issueKey:
          title: Jira Issue Key
          type: string
          required: true
          description: The Jira issue key to evaluate (e.g. 'PROJ-123').
  function:
    - key: resolver
      handler: index.handler
    - key: rovoActionHandler
      handler: index.rovoHandler
resources:
  - key: main
    path: src/frontend/index.tsx
  - key: issue-panel
    path: src/frontend/issuePanel.tsx
app:
  id: ari:cloud:ecosystem::app/f51ef525-93ce-41d8-8060-d45ee86d2c43
  compatibility:
    jira:
      required: true
    confluence:
      required: false
  runtime:
    name: nodejs24.x
permissions:
  scopes:
    - storage:app
    - read:jira-work
    - read:avatar:jira
    - read:group:jira
    - read:issue-type:jira
    - read:issue-type-hierarchy:jira
    - read:project:jira
    - read:project-category:jira
    - read:project-version:jira
    - read:project.component:jira
    - read:project.property:jira
    - read:user:jira
    - read:application-role:jira
    - read:permission:jira
    - read:space:confluence
    - read:page:confluence
